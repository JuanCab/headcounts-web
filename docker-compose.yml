services:
  headcounts:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./all_enrollments.parquet:/app/all_enrollments.parquet
      - ./all_enrollments.csv:/app/all_enrollments.csv
      - viewed-csvs:/app/viewed-csvs
      - ./templates:/app/templates:ro
      - ./app.py:/app/app.py:ro
      - ./utils.py:/app/utils.py:ro
    expose:
      - "8000"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.headcounts.rule=Host(`headcounts.mooreai.net`)"
      - "traefik.http.routers.headcounts.entrypoints=web"
      - "traefik.http.services.headcounts.loadbalancer.server.port=8000"
    networks:
      - proxy

networks:
  proxy:
    external: true

volumes:
  viewed-csvs:
